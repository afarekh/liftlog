<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>LiftLog</title>
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2c2c2c;
  --green:#22c55e;--gd:#16a34a;--gbg:#052e16;--gtext:#86efac;
  --text:#f1f5f9;--muted:#6b7280;--muted2:#4b5563;
  --red:#ef4444;--orange:#f97316;
  --shadow:0 4px 20px rgba(0,0,0,.5);
  --radius:14px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;color:var(--text);max-width:480px;margin:0 auto;display:flex;flex-direction:column}
input,button,select,textarea{font-family:inherit;outline:none}
button{cursor:pointer;border:none;background:none}

/* ── LOADING ── */
#loadScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.load-logo{font-size:32px;font-weight:900;color:var(--green);letter-spacing:-1px;margin-bottom:8px}
.load-sub{font-size:13px;color:var(--muted)}
.load-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin:0 3px;animation:loadbounce 1s infinite}
.load-dot:nth-child(2){animation-delay:.2s}
.load-dot:nth-child(3){animation-delay:.4s}
@keyframes loadbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* ── AUTH ── */
#authScreen{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:40px 24px 40px}
.auth-logo{text-align:center;margin-bottom:40px}
.auth-logo-text{font-size:38px;font-weight:900;color:var(--green);letter-spacing:-1.5px}
.auth-logo-sub{font-size:13px;color:var(--muted);margin-top:4px}
.auth-card{background:var(--surface);border-radius:var(--radius);padding:24px;border:1px solid var(--border)}
.auth-title{font-size:20px;font-weight:800;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.auth-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;font-size:15px;color:var(--text);transition:border-color .15s}
.auth-input:focus{border-color:var(--green)}
.btn-google{width:100%;padding:14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;transition:background .15s}
.btn-google:active{background:var(--border)}
.google-icon{width:20px;height:20px;flex-shrink:0}
.auth-divider{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.auth-divider-line{flex:1;height:1px;background:var(--border)}
.auth-divider-text{font-size:11px;color:var(--muted);white-space:nowrap}
.btn-primary{width:100%;padding:15px;background:var(--green);border-radius:var(--radius-sm);color:#fff;font-size:15px;font-weight:800;transition:opacity .15s;margin-bottom:14px}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.4}
.auth-toggle{text-align:center;font-size:13px;color:var(--muted)}
.auth-toggle a{color:var(--green);font-weight:700;cursor:pointer;text-decoration:none}
.auth-error{background:#2d1111;border:1px solid #7f1d1d;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:14px;display:none}

/* ── MAIN APP ── */
#mainApp{display:none;flex:1;flex-direction:column;overflow:hidden}
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:80px;display:none}
.page.active{display:block}

/* ── BOTTOM NAV ── */
#bnav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:50}
.nb{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;font-size:9px;font-weight:600;color:var(--muted2);transition:color .15s}
.nb.active{color:var(--green)}
.nb svg{width:22px;height:22px;stroke-width:1.8}
.nb-dot{width:4px;height:4px;border-radius:50%;background:transparent;transition:background .15s}
.nb.active .nb-dot{background:var(--green)}

/* ── SHARED COMPONENTS ── */
.pghdr{background:var(--bg);padding:env(safe-area-inset-top,28px) 16px 14px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.pgtitle{font-size:26px;font-weight:900;letter-spacing:-.5px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.sec{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip-g{background:var(--gbg);color:var(--gtext)}
.btn{width:100%;padding:15px;border-radius:var(--radius-sm);font-size:15px;font-weight:800;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-g{background:var(--green);color:#fff}
.btn-dark{background:var(--surface2);color:var(--text)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--muted)}
.btn-sm{padding:10px 16px;font-size:13px;font-weight:700;border-radius:var(--radius-sm);width:auto}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between}
.body-pad{padding:16px}
.empty-state{text-align:center;padding:60px 24px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:800;margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--muted);line-height:1.5}
.tab-bar{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer;border:none;background:none;transition:all .15s}
.tab.active{background:var(--surface);color:var(--text)}
.divider{height:1px;background:var(--border);margin:12px 0}
.badge{background:var(--green);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px;min-width:18px;text-align:center}

/* ── HOME ── */
.home-hdr{background:var(--surface);padding:env(safe-area-inset-top,28px) 16px 16px;border-bottom:1px solid var(--border)}
.home-greet{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.home-name{font-size:22px;font-weight:900;letter-spacing:-.3px}
.home-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hc{background:var(--surface2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--border)}
.hc-g{background:var(--gbg);color:var(--gtext);border-color:var(--gd)}
.today-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.today-card-hdr{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.today-card-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.today-card-title{font-size:20px;font-weight:900}
.today-ex-list{padding:0 16px}
.today-ex-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.today-ex-row:last-child{border-bottom:none}
.today-ex-name{font-size:14px;font-weight:600}
.today-ex-meta{font-size:12px;color:var(--muted)}
.today-card-btn{padding:12px 16px 14px}
.week-strip{display:flex;gap:6px;margin-bottom:16px}
.ws-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ws-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.ws-circle{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted)}
.ws-circle.today{border-color:var(--green);color:var(--green)}
.ws-circle.done{background:var(--green);border-color:var(--green);color:#fff}
.ws-circle.training{background:var(--gbg);border-color:var(--gd);color:var(--gtext)}
.ws-circle.rest{background:var(--surface2)}
.no-prog-card{text-align:center;padding:32px 20px}
.no-prog-icon{font-size:40px;margin-bottom:12px}
.no-prog-title{font-size:17px;font-weight:800;margin-bottom:6px}
.no-prog-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}

/* ── PROGRAMS PAGE ── */
.prog-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px;cursor:pointer}
.prog-card-body{padding:16px}
.prog-card-name{font-size:17px;font-weight:800;margin-bottom:4px}
.prog-card-meta{font-size:12px;color:var(--muted)}
.prog-card-bar{height:3px;background:var(--surface2)}
.prog-card-bar-fill{height:100%;background:var(--green);transition:width .3s}
.prog-card-footer{display:flex;gap:8px;padding:10px 16px;background:var(--surface2);border-top:1px solid var(--border)}
.active-badge{background:var(--gbg);color:var(--gtext);font-size:10px;font-weight:800;border-radius:20px;padding:3px 8px;border:1px solid var(--gd)}
.prog-day-pill{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s}
.prog-day-pill.selected{background:var(--gbg);border-color:var(--gd);color:var(--gtext)}

/* ── PROGRAM BUILDER ── */
#progBuilder{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;max-width:480px;margin:0 auto}
#progBuilder.open{display:flex}
.builder-hdr{background:var(--surface);padding:env(safe-area-inset-top,28px) 16px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.builder-title{font-size:18px;font-weight:800}
.builder-body{flex:1;overflow-y:auto;padding:16px}
.builder-footer{padding:16px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.step-ind{display:flex;gap:6px;margin-bottom:20px}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--surface2);transition:background .3s}
.step-dot.done{background:var(--green)}
.step-dot.active{background:var(--green);opacity:.5}
.fi{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--surface2);color:var(--text);margin-bottom:14px;transition:border-color .15s}
.fi:focus{border-color:var(--green)}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;width:fit-content}
.st-btn{width:36px;height:36px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;cursor:pointer;transition:background .15s}
.st-m{background:var(--border);color:var(--text)}
.st-p{background:var(--green);color:#fff}
.st-val{font-size:20px;font-weight:900;min-width:30px;text-align:center}
.st-unit{font-size:12px;color:var(--muted);font-weight:500}
.day-builder{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.day-builder-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.day-builder-name{font-size:15px;font-weight:800}
.day-builder-body{padding:12px 16px}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-row-info{flex:1}
.ex-row-name{font-size:14px;font-weight:700}
.ex-row-meta{font-size:12px;color:var(--muted);margin-top:2px}
.ex-row-del{width:30px;height:30px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:18px}
.sched-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.sched-day{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sched-day-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.sched-day-btn{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1;transition:all .15s}
.sched-day-btn.rest{background:var(--surface2);border-color:var(--border);color:var(--muted2)}
.sched-day-btn.assigned{background:var(--gbg);border-color:var(--gd);color:var(--gtext)}

/* ── EXERCISE PICKER ── */
#exPicker{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:flex-end}
#exPicker.open{display:flex}
.ex-picker-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;max-height:85vh;display:flex;flex-direction:column}
.ex-picker-hdr{padding:16px 16px 12px;flex-shrink:0}
.ex-picker-title{font-size:16px;font-weight:800;margin-bottom:12px}
.ex-search{width:100%;padding:11px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text);margin-bottom:10px}
.ex-search:focus{border-color:var(--green)}
.mg-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mg-chips::-webkit-scrollbar{display:none}
.mg-chip{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;transition:all .15s;white-space:nowrap}
.mg-chip.active{background:var(--gbg);color:var(--gtext);border-color:var(--gd)}
.ex-list{flex:1;overflow-y:auto;padding:0 16px 16px}
.ex-item{padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.ex-item:last-child{border-bottom:none}
.ex-item-name{font-size:14px;font-weight:700}
.ex-item-mg{font-size:11px;color:var(--muted);margin-top:2px}
.ex-item-add{width:28px;height:28px;border-radius:50%;background:var(--gbg);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:18px;font-weight:300;flex-shrink:0}

/* ── SET CONFIG (inside exercise picker) ── */
#setConfig{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;align-items:center;justify-content:center;padding:20px}
#setConfig.open{display:flex}
.set-config-card{background:var(--surface);border-radius:var(--radius);padding:24px;width:100%;max-width:360px}
.set-config-title{font-size:17px;font-weight:800;margin-bottom:4px}
.set-config-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.set-config-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.set-config-label{font-size:14px;font-weight:700}
.set-config-btns{display:flex;gap:8px;margin-top:4px}

/* ── SESSION OVERLAY ── */
#session{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column;max-width:480px;margin:0 auto}
#session.open{display:flex}
.sess-hdr{background:var(--surface);padding:env(safe-area-inset-top,28px) 16px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.sess-hdr-left{display:flex;flex-direction:column}
.sess-day-name{font-size:18px;font-weight:900}
.sess-timer{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sess-progress{font-size:12px;color:var(--green);font-weight:700}
.sess-end-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.sess-body{flex:1;overflow-y:auto;padding:16px}
.ex-view-name{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.ex-view-chips{display:flex;gap:6px;margin-bottom:16px}
.last-time-card{background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 14px;margin-bottom:16px}
.last-time-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.last-time-sets{display:flex;flex-wrap:wrap;gap:6px}
.last-time-set{background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.last-time-set span{color:var(--muted);font-weight:500}
.sets-table{width:100%;margin-bottom:12px}
.sets-table-hdr{display:grid;grid-template-columns:28px 1fr 1fr 70px 36px;gap:8px;padding:0 4px 8px;border-bottom:1px solid var(--border)}
.sets-table-hdr span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center}
.sets-table-hdr span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 70px 36px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border)}
.set-row.done{opacity:.6}
.set-num{font-size:13px;font-weight:700;color:var(--muted)}
.set-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:8px 4px;font-size:15px;font-weight:800;color:var(--text);text-align:center;width:100%;transition:border-color .15s}
.set-input:focus{border-color:var(--green)}
.set-row.done .set-input{background:var(--gbg);border-color:var(--gd);color:var(--gtext)}
.set-1rm{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.set-1rm.pr{color:var(--orange);font-weight:700}
.set-check{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.set-check.done{background:var(--green);border-color:var(--green)}
.add-set-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:14px;font-weight:700;width:100%;justify-content:center;margin-bottom:16px;transition:all .15s}
.add-set-btn:active{background:var(--border)}
.sess-nav{display:flex;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.sess-nav-btn{flex:1;padding:14px;border-radius:var(--radius-sm);font-size:14px;font-weight:800;text-align:center;cursor:pointer;border:none;transition:opacity .15s}
.sess-nav-btn:active{opacity:.7}
.sess-prev{background:var(--surface2);color:var(--muted)}
.sess-next{background:var(--green);color:#fff}
.sess-finish{background:var(--green);color:#fff;flex:2}

/* ── REST TIMER ── */
#restTimer{display:none;background:var(--surface);border-top:2px solid var(--green);padding:12px 16px;flex-shrink:0;flex-direction:row;align-items:center;justify-content:space-between}
#restTimer.show{display:flex}
.rest-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.rest-count{font-size:28px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}
.rest-skip{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;font-weight:700;color:var(--muted)}
.rest-bar{position:absolute;bottom:0;left:0;height:2px;background:var(--green);transition:width 1s linear}

/* ── WORKOUT SUMMARY ── */
#wSummary{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;flex-direction:column;max-width:480px;margin:0 auto;overflow-y:auto}
#wSummary.open{display:flex}
.summary-hdr{padding:env(safe-area-inset-top,40px) 20px 20px;text-align:center}
.summary-icon{font-size:56px;margin-bottom:12px}
.summary-title{font-size:28px;font-weight:900;margin-bottom:4px}
.summary-sub{font-size:14px;color:var(--muted)}
.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.summary-stat{background:var(--surface);border-radius:var(--radius-sm);padding:16px;text-align:center;border:1px solid var(--border)}
.summary-stat-val{font-size:26px;font-weight:900;color:var(--green)}
.summary-stat-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.pr-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.pr-trophy{font-size:20px}
.pr-info{flex:1}
.pr-name{font-size:14px;font-weight:700}
.pr-val{font-size:12px;color:var(--orange);font-weight:700}

/* ── HISTORY ── */
.hist-session{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;cursor:pointer}
.hist-session-hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.hist-session-date{font-size:15px;font-weight:800}
.hist-session-meta{font-size:12px;color:var(--muted);margin-top:2px}
.hist-session-body{padding:0 16px 14px;display:none}
.hist-session.expanded .hist-session-body{display:block}
.hist-ex{margin-bottom:8px}
.hist-ex-name{font-size:13px;font-weight:700;margin-bottom:4px}
.hist-set-row{display:flex;gap:8px;margin-bottom:2px}
.hist-set-chip{background:var(--surface2);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.chart-container{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px}
.chart-title{font-size:14px;font-weight:800;margin-bottom:12px}
.chart-area{height:140px;position:relative;overflow:hidden}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100%}
.chart-bar{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:4px;transition:height .3s;position:relative}
.chart-bar:hover{background:var(--gd)}
.chart-bar-lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted);white-space:nowrap}
.ex-select{width:100%;padding:12px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px}

/* ── PROFILE ── */
.profile-hdr{background:var(--surface);padding:env(safe-area-inset-top,40px) 16px 20px;text-align:center;border-bottom:1px solid var(--border)}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--gbg);border:2px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--green);margin:0 auto 12px}
.profile-name{font-size:20px;font-weight:900}
.profile-email{font-size:13px;color:var(--muted);margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-box{background:var(--surface);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;border:1px solid var(--border)}
.stat-val{font-size:22px;font-weight:900;color:var(--green)}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:700}
.setting-sub{font-size:12px;color:var(--muted);margin-top:2px}
.setting-val{font-size:13px;color:var(--muted);font-weight:600}
.toggle{width:46px;height:26px;border-radius:13px;background:var(--muted2);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s}
.toggle.on .toggle-knob{left:23px}
.bw-entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.bw-date{font-size:13px;font-weight:700;flex:1}
.bw-val{font-size:15px;font-weight:900;color:var(--green)}

/* ── PR TOAST ── */
#prToast{display:none;position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#854d0e,#f97316);color:#fff;border-radius:var(--radius);padding:12px 20px;font-size:14px;font-weight:800;z-index:500;box-shadow:var(--shadow);animation:slidedown .3s;white-space:nowrap}
@keyframes slidedown{from{transform:translateX(-50%) translateY(-40px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── CONFIRM DIALOG ── */
#confirmDialog{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;align-items:center;justify-content:center;padding:20px}
#confirmDialog.open{display:flex}
.confirm-card{background:var(--surface);border-radius:var(--radius);padding:24px;width:100%;max-width:320px}
.confirm-title{font-size:18px;font-weight:800;margin-bottom:8px}
.confirm-msg{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-cancel{flex:1;padding:13px;background:var(--surface2);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--muted)}
.confirm-ok{flex:1;padding:13px;background:var(--red);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:#fff}

/* ── ANIMATIONS ── */
.fade-in{animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ═══════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════
const FB_CONFIG = {
  apiKey:"AIzaSyAB6ux2qMCxQ_0KdNDs72l3cdFdcVAkDr8",
  authDomain:"liftlogv2.firebaseapp.com",
  projectId:"liftlogv2",
  storageBucket:"liftlogv2.firebasestorage.app",
  messagingSenderId:"686329670108",
  appId:"1:686329670108:web:1f64d568b259408648c719"
};
firebase.initializeApp(FB_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence().catch(()=>{});

// ═══════════════════════════════════════════
// EXERCISE DATABASE
// ═══════════════════════════════════════════
const EX = {
  'Chest':['Bench Press','Incline Bench Press','Decline Bench Press','Dumbbell Fly','Incline Dumbbell Fly','Cable Fly','Chest Dips','Push-ups'],
  'Back':['Deadlift','Pull-ups','Chin-ups','Barbell Row','Dumbbell Row','Lat Pulldown','Seated Cable Row','Face Pull','T-Bar Row','Rack Pull'],
  'Shoulders':['Overhead Press','Dumbbell Shoulder Press','Lateral Raise','Front Raise','Rear Delt Fly','Arnold Press','Upright Row','Cable Lateral Raise'],
  'Biceps':['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Concentration Curl','Cable Curl','EZ Bar Curl','Incline Dumbbell Curl'],
  'Triceps':['Tricep Pushdown','Overhead Tricep Extension','Skull Crusher','Close Grip Bench Press','Tricep Dips','Diamond Push-ups','Cable Kickback'],
  'Legs':['Squat','Front Squat','Leg Press','Romanian Deadlift','Leg Curl','Leg Extension','Bulgarian Split Squat','Lunges','Calf Raise','Hack Squat','Sumo Deadlift'],
  'Glutes':['Hip Thrust','Glute Bridge','Cable Kickback','Step-ups','Sumo Squat'],
  'Core':['Plank','Crunches','Russian Twist','Leg Raise','Ab Wheel','Cable Crunch','Hanging Knee Raise','Side Plank','Mountain Climbers'],
};
const MG_ALL = Object.keys(EX);

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let U = null; // current user
let profile = {};
let programs = [];
let workouts = [];
let prs = {};
let settings = { restTime: 90, unit: 'kg' };

// Active workout session
let session = null;
let sessTimerInt = null;
let sessStart = null;
let restInt = null;
let restRemaining = 0;
let currentExIdx = 0;

// Program builder state
let builder = { step:0, prog:null };

// Exercise picker callback
let exPickerTarget = null; // { dayIdx }
let exPickerSelected = null; // { name, muscle }
let setConfigSets = 3;
let setConfigReps = 8;

// History tab
let hTab = 0;

// Confirm callback
let confirmCb = null;

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
auth.onAuthStateChanged(user => {
  if (user) {
    U = user;
    loadAll().then(() => {
      hide('loadScreen');
      showApp();
    });
  } else {
    hide('loadScreen');
    show('authScreen', 'flex');
  }
});

// Handle Google redirect result
auth.getRedirectResult().catch(err => { showAuthError(err.message); });

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
let authMode = 'login';

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  const isSignup = authMode === 'signup';
  el('authTitle').textContent = isSignup ? 'Create account' : 'Welcome back';
  el('authSubtitle').textContent = isSignup ? 'Start your fitness journey' : 'Sign in to continue';
  el('authBtn').textContent = isSignup ? 'Sign Up' : 'Sign In';
  el('authToggleText').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
  el('authToggleLink').textContent = isSignup ? 'Sign in' : 'Sign up';
  el('nameField').style.display = isSignup ? 'block' : 'none';
  el('authError').style.display = 'none';
}

async function submitAuth() {
  const email = el('authEmail').value.trim();
  const pass = el('authPassword').value;
  const btn = el('authBtn');
  if (!email || !pass) return showAuthError('Please fill in all fields');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    if (authMode === 'login') {
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const name = el('authName').value.trim() || email.split('@')[0];
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await createProfile(cred.user, name);
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
    showAuthError(friendlyAuthError(e.code));
  }
}

async function signInGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await auth.signInWithPopup(provider);
    // Create profile if first time
    const snap = await db.doc(`users/${result.user.uid}/data/profile`).get();
    if (!snap.exists) await createProfile(result.user, result.user.displayName || 'Athlete');
  } catch(e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    } else {
      showAuthError(friendlyAuthError(e.code));
    }
  }
}

async function createProfile(user, name) {
  await db.doc(`users/${user.uid}/data/profile`).set({
    name, email: user.email || '', createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    unit: 'kg', restTime: 90
  });
}

function showAuthError(msg) {
  const e = el('authError');
  e.textContent = msg;
  e.style.display = 'block';
}

function friendlyAuthError(code) {
  const map = {
    'auth/invalid-email': 'Invalid email address',
    'auth/user-not-found': 'No account found with this email',
    'auth/wrong-password': 'Incorrect password',
    'auth/email-already-in-use': 'This email is already registered',
    'auth/weak-password': 'Password must be at least 6 characters',
    'auth/invalid-credential': 'Incorrect email or password',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

async function logout() {
  await auth.signOut();
  U = null; programs = []; workouts = []; prs = {};
  hide('mainApp');
  show('authScreen', 'flex');
}

// ═══════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════
async function loadAll() {
  const uid = U.uid;
  const [profSnap, progSnap, workSnap, prSnap] = await Promise.all([
    db.doc(`users/${uid}/data/profile`).get(),
    db.collection(`users/${uid}/programs`).orderBy('createdAt','desc').get(),
    db.collection(`users/${uid}/workouts`).orderBy('date','desc').limit(50).get(),
    db.collection(`users/${uid}/prs`).get()
  ]);

  if (profSnap.exists) {
    profile = profSnap.data();
    settings.unit = profile.unit || 'kg';
    settings.restTime = profile.restTime || 90;
  } else {
    profile = { name: U.displayName || 'Athlete', email: U.email || '' };
    await createProfile(U, profile.name);
  }

  programs = progSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  workouts = workSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  prs = {};
  prSnap.docs.forEach(d => { prs[d.id] = d.data(); });
}

async function saveWorkout(w) {
  const ref = await db.collection(`users/${U.uid}/workouts`).add(w);
  workouts.unshift({ id: ref.id, ...w });
}

async function saveProgram(prog) {
  const data = { ...prog, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  if (prog.id) {
    await db.doc(`users/${U.uid}/programs/${prog.id}`).set(data, { merge: true });
    const idx = programs.findIndex(p => p.id === prog.id);
    if (idx >= 0) programs[idx] = { ...programs[idx], ...data };
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    const ref = await db.collection(`users/${U.uid}/programs`).add(data);
    programs.unshift({ id: ref.id, ...data });
    return ref.id;
  }
}

async function setActiveProgram(id) {
  const batch = db.batch();
  programs.forEach(p => {
    batch.update(db.doc(`users/${U.uid}/programs/${p.id}`), { active: p.id === id });
  });
  await batch.commit();
  programs.forEach(p => { p.active = p.id === id; });
}

async function deleteProgram(id) {
  await db.doc(`users/${U.uid}/programs/${id}`).delete();
  programs = programs.filter(p => p.id !== id);
}

async function updatePR(name, weight, reps) {
  const est = calc1RM(weight, reps);
  const key = name.replace(/\//g,'_');
  const existing = prs[key];
  if (!existing || est > existing.est1rm) {
    const data = { weight, reps, est1rm: est, date: dateStr(new Date()) };
    await db.doc(`users/${U.uid}/prs/${key}`).set(data);
    prs[key] = data;
    return true; // new PR
  }
  return false;
}

async function saveSettings(s) {
  settings = { ...settings, ...s };
  await db.doc(`users/${U.uid}/data/profile`).update(s);
  profile = { ...profile, ...s };
}

const PAGES = ['pgHome','pgPrograms','pgHistory','pgProfile'];

function goPage(n) {

// ═══════════════════════════════════════════
// HOME PAGE
// ═══════════════════════════════════════════
function renderHome() {
  const hour = new Date().getHours();
  el('homeGreet').textContent = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const name = (profile.name || '').split(' ')[0];
  el('homeName').textContent = name;
  el('homeAvatar').textContent = name.charAt(0).toUpperCase();

  // Chips
  const streak = calcStreak();
  const weekCount = workoutsThisWeek();
  el('homeChips').innerHTML = `
    <div class="hc ${streak>0?'hc-g':''}">🔥 ${streak} day streak</div>
    <div class="hc">📅 ${weekCount} this week</div>
    ${prsThisWeek()>0?`<div class="hc" style="background:#1c1100;color:#fbbf24;border-color:#92400e">🏆 ${prsThisWeek()} PRs this week</div>`:''}
  `;

  const active = programs.find(p => p.active);
  let html = '';

  // Week strip
  html += renderWeekStrip(active);

  // Today card
  html += renderTodayCard(active);

  el('homeBody').innerHTML = html;
}

function renderWeekStrip(active) {
  const days = ['M','T','W','T','F','S','S'];
  const today = new Date();
  const todayDow = (today.getDay()+6)%7; // 0=Mon
  let html = '<div class="week-strip">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - todayDow + i);
    const ds = dateStr(d);
    const isToday = i === todayDow;
    const logged = workouts.find(w => w.date === ds);
    const isTraining = active && active.schedule && active.schedule[d.getDay()] !== undefined && active.schedule[d.getDay()] !== -1;
    let cls = 'ws-circle';
    if (logged) cls += ' done';
    else if (isToday) cls += ' today';
    else if (isTraining && d > today) cls += ' training';
    const label = logged ? '✓' : isToday ? '•' : days[i];
    html += `<div class="ws-day"><div class="ws-lbl">${days[i]}</div><div class="${cls}">${label}</div></div>`;
  }
  return html + '</div>';
}

function renderTodayCard(active) {
  const today = new Date();
  const todayStr = dateStr(today);
  const alreadyDone = workouts.find(w => w.date === todayStr);

  if (alreadyDone) {
    const dur = alreadyDone.duration || 0;
    const exCount = (alreadyDone.exercises||[]).length;
    return `
      <div class="card" style="border-color:var(--gd)">
        <div style="text-align:center;padding:8px 0">
          <div style="font-size:36px;margin-bottom:8px">✅</div>
          <div style="font-size:17px;font-weight:900;margin-bottom:4px">Workout Complete!</div>
          <div style="font-size:13px;color:var(--muted)">${alreadyDone.dayName||'Workout'} · ${exCount} exercises · ${dur} min</div>
        </div>
      </div>`;
  }

  if (!active) {
    return `
      <div class="card no-prog-card">
        <div class="no-prog-icon">🏗️</div>
        <div class="no-prog-title">No active program</div>
        <div class="no-prog-sub">Create a program to get your daily workouts planned automatically.</div>
        <button class="btn btn-g" onclick="goPage(1);setTimeout(openProgBuilder,100)">Create Program</button>
      </div>`;
  }

  const dow = today.getDay();
  const sched = active.schedule || {};
  const dayIdx = sched[dow];

  if (dayIdx === undefined || dayIdx === -1) {
    return `
      <div class="card" style="text-align:center;padding:24px">
        <div style="font-size:36px;margin-bottom:8px">💤</div>
        <div style="font-size:17px;font-weight:800;margin-bottom:4px">Rest Day</div>
        <div style="font-size:13px;color:var(--muted)">${active.name} · Recovery is part of the plan</div>
      </div>`;
  }

  const day = (active.days||[])[dayIdx];
  if (!day) return '<div class="card"><div style="color:var(--muted);text-align:center;padding:20px">No workout assigned for today</div></div>';

  const exRows = (day.exercises||[]).slice(0,4).map(e =>
    `<div class="today-ex-row">
      <div><div class="today-ex-name">${e.name}</div><div class="today-ex-meta">${e.sets} sets × ${e.reps} reps</div></div>
      <div class="chip" style="font-size:10px">${e.muscle}</div>
    </div>`
  ).join('');
  const moreCount = (day.exercises||[]).length - 4;

  return `
    <div class="today-card fade-in">
      <div class="today-card-hdr">
        <div class="today-card-label">Today's Workout · ${active.name}</div>
        <div class="today-card-title">${day.name}</div>
      </div>
      <div class="today-ex-list">
        ${exRows}
        ${moreCount > 0 ? `<div class="today-ex-row"><div style="color:var(--muted);font-size:13px">+${moreCount} more exercises</div></div>` : ''}
      </div>
      <div class="today-card-btn">
        <button class="btn btn-g" onclick="startWorkout('${active.id}',${dayIdx})">Start Workout</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════
// WORKOUT SESSION
// ═══════════════════════════════════════════
function startWorkout(progId, dayIdx) {
  const prog = programs.find(p => p.id === progId);
  if (!prog) return;
  const day = prog.days[dayIdx];
  if (!day || !day.exercises || day.exercises.length === 0) return;

  session = {
    progId, dayIdx,
    dayName: day.name,
    progName: prog.name,
    exercises: day.exercises.map(e => ({
      name: e.name, muscle: e.muscle,
      targetSets: e.sets, targetReps: e.reps,
      sets: Array.from({length: e.sets}, () => ({ weight: '', reps: '', done: false }))
    })),
    newPRs: [],
    date: dateStr(new Date()),
  };

  currentExIdx = 0;
  sessStart = Date.now();

  // Start session timer
  clearInterval(sessTimerInt);
  sessTimerInt = setInterval(updateSessTimer, 1000);

  renderSession();
  show('session');
}

function updateSessTimer() {
  const elapsed = Math.floor((Date.now() - sessStart) / 1000);
  const m = Math.floor(elapsed/60), s = elapsed%60;
  el('sessTimer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function renderSession() {
  if (!session) return;
  el('sessDayName').textContent = session.dayName;
  el('sessProgress').textContent = `${currentExIdx+1} / ${session.exercises.length}`;
  renderCurrentExercise();
  renderSessNav();
}

function renderCurrentExercise() {
  const ex = session.exercises[currentExIdx];
  if (!ex) return;

  // Find previous performance
  const prev = getPrevPerformance(ex.name);
  const prevHtml = prev ?
    `<div class="last-time-card">
      <div class="last-time-label">Last time</div>
      <div class="last-time-sets">${prev.sets.filter(s=>s.done||s.weight).map(s=>
        `<div class="last-time-set">${s.weight||'?'}<span>${settings.unit}</span> × ${s.reps||'?'}</div>`
      ).join('')}</div>
    </div>` : '';

  let setsHtml = `
    <div class="sets-table">
      <div class="sets-table-hdr">
        <span>#</span><span>${settings.unit}</span><span>Reps</span><span>~1RM</span><span></span>
      </div>`;

  ex.sets.forEach((s, i) => {
    const est = s.weight && s.reps ? `~${calc1RM(parseFloat(s.weight),parseInt(s.reps)).toFixed(1)}` : '—';
    const prevSet = prev ? prev.sets[i] : null;
    const prevPR = prs[ex.name.replace(/\//g,'_')];
    const isPR = s.done && s.weight && s.reps && prevPR && calc1RM(parseFloat(s.weight),parseInt(s.reps)) > prevPR.est1rm;
    setsHtml += `
      <div class="set-row ${s.done?'done':''}" id="setrow-${i}">
        <div class="set-num">${i+1}</div>
        <input class="set-input" id="w-${i}" type="number" inputmode="decimal" placeholder="${prevSet&&prevSet.weight?prevSet.weight:(prev&&prev.sets[0]?prev.sets[0].weight:'')}" value="${s.weight}" onchange="updateSet(${i},'weight',this.value)" onfocus="this.select()">
        <input class="set-input" id="r-${i}" type="number" inputmode="numeric" placeholder="${ex.targetReps}" value="${s.reps}" onchange="updateSet(${i},'reps',this.value)" onfocus="this.select()">
        <div class="set-1rm ${isPR?'pr':''}" id="1rm-${i}">${est}</div>
        <div class="set-check ${s.done?'done':''}" id="chk-${i}" onclick="toggleSet(${i})">
          ${s.done?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`:''}
        </div>
      </div>`;
  });
  setsHtml += '</div>';

  el('sessBody').innerHTML = `
    <div class="fade-in">
      <div class="ex-view-name">${ex.name}</div>
      <div class="ex-view-chips">
        <div class="chip chip-g">${ex.muscle}</div>
        <div class="chip">${ex.targetSets} × ${ex.targetReps}</div>
      </div>
      ${prevHtml}
      ${setsHtml}
      <button class="add-set-btn" onclick="addSet()">+ Add Set</button>
    </div>`;
}

function updateSet(setIdx, field, val) {
  const ex = session.exercises[currentExIdx];
  ex.sets[setIdx][field] = val;
  // Update 1RM display
  const s = ex.sets[setIdx];
  const est = s.weight && s.reps ? `~${calc1RM(parseFloat(s.weight),parseInt(s.reps)).toFixed(1)}` : '—';
  const el1rm = el(`1rm-${setIdx}`);
  if (el1rm) el1rm.textContent = est;
}

function toggleSet(setIdx) {
  const ex = session.exercises[currentExIdx];
  const s = ex.sets[setIdx];

  // Read current input values before toggling
  const wEl = el(`w-${setIdx}`);
  const rEl = el(`r-${setIdx}`);
  if (wEl) s.weight = wEl.value;
  if (rEl) s.reps = rEl.value;

  s.done = !s.done;

  if (s.done && s.weight && s.reps) {
    startRestTimer(settings.restTime);
  }

  // Re-render just the row
  const row = el(`setrow-${setIdx}`);
  if (row) {
    const est = s.weight && s.reps ? `~${calc1RM(parseFloat(s.weight),parseInt(s.reps)).toFixed(1)}` : '—';
    row.className = `set-row ${s.done?'done':''}`;
    const chk = el(`chk-${setIdx}`);
    if (chk) {
      chk.className = `set-check ${s.done?'done':''}`;
      chk.innerHTML = s.done ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : '';
    }
    const rm = el(`1rm-${setIdx}`);
    if (rm) rm.textContent = est;
  }
}

function addSet() {
  const ex = session.exercises[currentExIdx];
  const lastSet = ex.sets[ex.sets.length-1];
  ex.sets.push({ weight: lastSet?.weight||'', reps: lastSet?.reps||'', done: false });
  renderCurrentExercise();
}

function renderSessNav() {
  const isLast = currentExIdx === session.exercises.length - 1;
  const isFirst = currentExIdx === 0;
  el('sessNav').innerHTML = `
    ${!isFirst ? `<button class="sess-nav-btn sess-prev" onclick="sessGoEx(-1)">← Back</button>` : ''}
    ${isLast
      ? `<button class="sess-nav-btn sess-finish ${isFirst?'':''}">
           <span onclick="finishWorkout()">Finish Workout 🏁</span>
         </button>`
      : `<button class="sess-nav-btn sess-next" onclick="sessGoEx(1)">Next →</button>`
    }`;
}

function sessGoEx(dir) {
  currentExIdx = Math.max(0, Math.min(session.exercises.length-1, currentExIdx+dir));
  stopRest();
  renderSession();
}

async function finishWorkout() {
  if (!session) return;
  clearInterval(sessTimerInt);
  stopRest();
  const duration = Math.round((Date.now() - sessStart) / 60000);

  // Detect PRs
  const newPRs = [];
  for (const ex of session.exercises) {
    const doneSets = ex.sets.filter(s => s.done && s.weight && s.reps);
    if (!doneSets.length) continue;
    const best = doneSets.reduce((b,s) => calc1RM(parseFloat(s.weight),parseInt(s.reps)) > calc1RM(parseFloat(b.weight),parseInt(b.reps)) ? s : b);
    const isNew = await updatePR(ex.name, parseFloat(best.weight), parseInt(best.reps));
    if (isNew) newPRs.push({ name: ex.name, weight: best.weight, reps: best.reps, est: calc1RM(parseFloat(best.weight),parseInt(best.reps)).toFixed(1) });
  }

  const w = {
    date: session.date,
    dayName: session.dayName,
    progName: session.progName,
    duration,
    exercises: session.exercises.map(ex => ({
      name: ex.name, muscle: ex.muscle,
      sets: ex.sets.filter(s => s.done && s.weight && s.reps)
    })),
    newPRs: newPRs.map(p=>p.name),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  await saveWorkout(w);
  hide('session');
  showSummary(w, duration, newPRs);
}

function confirmEndSession() {
  showConfirm('End Workout?', 'Your progress will be lost.', 'End', () => {
    clearInterval(sessTimerInt);
    stopRest();
    session = null;
    hide('session');
    renderHome();
  });
}

function showSummary(w, duration, newPRs) {
  const totalSets = w.exercises.reduce((a,e)=>a+(e.sets||[]).length,0);
  const totalVol = w.exercises.reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0);

  el('summarySubtitle').textContent = `${w.dayName} · ${dateLabel(new Date())}`;
  el('summaryStats').innerHTML = `
    <div class="summary-stat"><div class="summary-stat-val">${duration}</div><div class="summary-stat-lbl">Minutes</div></div>
    <div class="summary-stat"><div class="summary-stat-val">${w.exercises.length}</div><div class="summary-stat-lbl">Exercises</div></div>
    <div class="summary-stat"><div class="summary-stat-val">${totalSets}</div><div class="summary-stat-lbl">Total Sets</div></div>
    <div class="summary-stat"><div class="summary-stat-val">${totalVol>=1000?(totalVol/1000).toFixed(1)+'k':totalVol}</div><div class="summary-stat-lbl">Volume (${settings.unit})</div></div>
  `;

  if (newPRs.length) {
    el('summaryPRs').innerHTML = `
      <span class="sec">🏆 New Personal Records</span>
      <div class="card" style="border-color:var(--orange);background:#1c1100;margin-bottom:16px">
        ${newPRs.map(p=>`
          <div class="pr-row">
            <div class="pr-trophy">🏆</div>
            <div class="pr-info">
              <div class="pr-name">${p.name}</div>
              <div class="pr-val">${p.weight}${settings.unit} × ${p.reps} reps · ~${p.est}${settings.unit} 1RM</div>
            </div>
          </div>`).join('')}
      </div>`;
  } else {
    el('summaryPRs').innerHTML = '';
  }

  el('summaryExercises').innerHTML = `
    <span class="sec">Exercises</span>
    ${w.exercises.map(e=>`
      <div class="card" style="margin-bottom:8px">
        <div style="font-size:15px;font-weight:800;margin-bottom:8px">${e.name}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${(e.sets||[]).map(s=>`<div class="chip chip-g">${s.weight}${settings.unit} × ${s.reps}</div>`).join('')}
        </div>
      </div>`).join('')}
  `;

  show('wSummary');
  session = null;
}

function closeSummary() {
  hide('wSummary');
  goPage(0);
}

// ═══════════════════════════════════════════
// REST TIMER
// ═══════════════════════════════════════════
function startRestTimer(seconds) {
  stopRest();
  restRemaining = seconds;
  show('restTimer');
  updateRestDisplay();
  restInt = setInterval(() => {
    restRemaining--;
    if (restRemaining <= 0) {
      stopRest();
      // Vibrate if supported
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
    } else {
      updateRestDisplay();
    }
  }, 1000);
}

function updateRestDisplay() {
  const m = Math.floor(restRemaining/60), s = restRemaining%60;
  el('restCount').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function skipRest() { stopRest(); }

function stopRest() {
  clearInterval(restInt);
  restInt = null;
  hide('restTimer');
}

    el('programsBody').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏗️</div>

      </div>`;

  }

    return `
      <div class="prog-card">
        <div class="prog-card-body" onclick="toggleProgDetails('${prog.id}')">
          <div class="row-between">
            <div>
              <div class="prog-card-name">${prog.name}</div>
              <div class="prog-card-meta">${daysCount} day types · ${trainDays} days/week · ${prog.weeks||8} weeks</div>
            </div>
            ${prog.active ? '<div class="active-badge">ACTIVE</div>' : ''}
          </div>
        </div>

          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">

          </div>

            <button class="btn btn-dark btn-sm" onclick="editProgram('${prog.id}')">Edit</button>
            <button class="btn btn-outline btn-sm" style="color:var(--red);border-color:var(--red)" onclick="confirmDeleteProg('${prog.id}')">Delete</button>
          </div>
        </div>

  }).join('');
}

function toggleProgDetails(id) {
  const d = el(`prog-details-${id}`);
  d.style.display = d.style.display === 'none' ? 'block' : 'none';
}

async function activateProg(id) {
  await setActiveProgram(id);
  renderPrograms();
  renderHome();
}

function confirmDeleteProg(id) {
  const prog = programs.find(p=>p.id===id);
  showConfirm('Delete Program?', `"${prog?.name}" will be permanently deleted.`, 'Delete', async () => {
    await deleteProgram(id);
    renderPrograms();
    renderHome();
  });
}

// ═══════════════════════════════════════════
// PROGRAM BUILDER
// ═══════════════════════════════════════════
function openProgBuilder(existingId) {
  if (existingId) {
    const prog = programs.find(p=>p.id===existingId);
    builder = { step:0, prog: JSON.parse(JSON.stringify(prog)) };
    el('builderTitle').textContent = 'Edit Program';
  } else {
    builder = {
      step: 0,
      prog: { name:'', weeks:8, startDate: dateStr(new Date()), days:[], schedule:{0:-1,1:-1,2:-1,3:-1,4:-1,5:-1,6:-1} }
    };
    el('builderTitle').textContent = 'New Program';
  }
  show('progBuilder');
  renderBuilderStep();
}

function editProgram(id) { openProgBuilder(id); }

function closeProgBuilder() {
  hide('progBuilder');
  builder = { step:0, prog:null };
}

function renderBuilderStep() {
  const { step, prog } = builder;
  const steps = 3;

  // Step indicators
  const dotsHtml = Array.from({length:steps}, (_,i) =>
    `<div class="step-dot ${i<step?'done':i===step?'active':''}"></div>`
  ).join('');

  let bodyHtml = `<div class="step-ind">${dotsHtml}</div>`;
  let footerHtml = '';

  if (step === 0) {
    bodyHtml += `
      <span class="sec">Program Name</span>
      <input class="fi" id="bldName" type="text" placeholder="e.g. Push Pull Legs" value="${prog.name}" autocomplete="off">
      <span class="sec">Duration</span>
      <div class="row" style="gap:16px;margin-bottom:20px">
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Weeks</div>
          <div class="stepper">
            <button class="st-btn st-m" onclick="bldAdj('weeks',-1)">−</button>
            <div class="st-val" id="bldWeeks">${prog.weeks}</div>
            <span class="st-unit">wks</span>
            <button class="st-btn st-p" onclick="bldAdj('weeks',1)">+</button>
          </div>
        </div>
      </div>
      <span class="sec">Start Date</span>
      <input class="fi" id="bldStart" type="date" value="${prog.startDate}">
    `;
    footerHtml = `<button class="btn btn-g" onclick="bldNext()">Next: Training Days →</button>`;
  }

  else if (step === 1) {
    const daysHtml = prog.days.map((d,i) => `
      <div class="day-builder" id="daycard-${i}">
        <div class="day-builder-hdr">
          <input style="background:none;border:none;color:var(--text);font-size:15px;font-weight:800;flex:1;outline:none" value="${d.name}" onchange="prog.days[${i}].name=this.value" placeholder="Day ${i+1} name">
          <button onclick="removeDay(${i})" style="color:var(--muted2);font-size:20px;line-height:1">✕</button>
        </div>
        <div class="day-builder-body">
          ${d.exercises.length===0?`<div style="color:var(--muted);font-size:13px;margin-bottom:10px">No exercises yet</div>`:''}
          ${d.exercises.map((e,ei)=>`
            <div class="ex-row">
              <div class="ex-row-info">
                <div class="ex-row-name">${e.name}</div>
                <div class="ex-row-meta">${e.sets} sets × ${e.reps} reps · ${e.muscle}</div>
              </div>
              <button class="ex-row-del" onclick="removeExFromDay(${i},${ei})">✕</button>
            </div>`).join('')}
          <button class="add-set-btn" onclick="openExPicker(${i})">+ Add Exercise</button>
        </div>
      </div>`).join('');

    bodyHtml += `
      <div style="margin-bottom:16px">
        <div style="font-size:14px;color:var(--muted);margin-bottom:12px">Create your training days and add exercises to each.</div>
        ${daysHtml}
        <button class="btn btn-outline" onclick="addDay()">+ Add Training Day</button>
      </div>`;
    footerHtml = `
      <div style="display:flex;gap:10px">
        <button class="btn btn-dark" style="flex:1" onclick="bldBack()">← Back</button>
        <button class="btn btn-g" style="flex:2" onclick="bldNext()">Next: Schedule →</button>
      </div>`;
  }

  else if (step === 2) {
    const dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const schedHtml = dowLabels.map((lbl,dow) => {
      const assigned = prog.schedule[dow];
      const dayName = assigned !== undefined && assigned !== -1 && prog.days[assigned] ? prog.days[assigned].name : 'Rest';
      const cls = (assigned !== undefined && assigned !== -1) ? 'assigned' : 'rest';
      return `
        <div class="sched-day" onclick="cycleSchedDay(${dow})">
          <div class="sched-day-lbl">${lbl}</div>
          <div class="sched-day-btn ${cls}">${dayName==='Rest'?'💤':dayName.substring(0,4)}</div>
        </div>`;
    }).join('');

    bodyHtml += `
      <div style="font-size:14px;color:var(--muted);margin-bottom:16px">Tap each day to assign a workout. Tap again to cycle through your days.</div>
      <div class="sched-grid">${schedHtml}</div>
      <div class="card" style="margin-top:4px">
        <span class="sec">Legend</span>
        ${prog.days.map(d=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div class="chip chip-g" style="font-size:11px">${d.name}</div></div>`).join('')}
        <div style="display:flex;align-items:center;gap:8px"><div class="chip" style="font-size:11px">💤 Rest</div></div>
      </div>`;
    footerHtml = `
      <div style="display:flex;gap:10px">
        <button class="btn btn-dark" style="flex:1" onclick="bldBack()">← Back</button>
        <button class="btn btn-g" style="flex:2" onclick="bldSave()">Save Program ✓</button>
      </div>`;
  }

  el('builderBody').innerHTML = bodyHtml;
  el('builderFooter').innerHTML = footerHtml;
}

function bldAdj(field, delta) {
  const min = { weeks:1 }[field] || 1;
  const max = { weeks:52 }[field] || 99;
  builder.prog[field] = Math.max(min, Math.min(max, (builder.prog[field]||0)+delta));
  el(`bld${field.charAt(0).toUpperCase()+field.slice(1)}`).textContent = builder.prog[field];
}

function bldNext() {
  if (builder.step === 0) {
    const name = el('bldName').value.trim();
    if (!name) { el('bldName').focus(); return; }
    builder.prog.name = name;
    builder.prog.startDate = el('bldStart').value || dateStr(new Date());
    if (!builder.prog.days.length) builder.prog.days.push({ name:'Day 1', exercises:[] });
  } else if (builder.step === 1) {
    if (!builder.prog.days.length) { alert('Add at least one training day'); return; }
  }
  builder.step++;
  renderBuilderStep();
}

function bldBack() { builder.step--; renderBuilderStep(); }

function addDay() {
  builder.prog.days.push({ name:`Day ${builder.prog.days.length+1}`, exercises:[] });
  renderBuilderStep();
}

function removeDay(idx) {
  builder.prog.days.splice(idx,1);
  // Fix schedule references
  Object.keys(builder.prog.schedule).forEach(dow => {
    if (builder.prog.schedule[dow] === idx) builder.prog.schedule[dow] = -1;
    else if (builder.prog.schedule[dow] > idx) builder.prog.schedule[dow]--;
  });
  renderBuilderStep();
}

function removeExFromDay(dayIdx, exIdx) {
  builder.prog.days[dayIdx].exercises.splice(exIdx,1);
  renderBuilderStep();
}

function cycleSchedDay(dow) {
  const opts = [-1, ...builder.prog.days.map((_,i)=>i)];
  const cur = builder.prog.schedule[dow] ?? -1;
  const idx = opts.indexOf(cur);
  builder.prog.schedule[dow] = opts[(idx+1) % opts.length];
  renderBuilderStep();
}

async function bldSave() {
  const prog = builder.prog;
  if (!prog.name) return;
  if (prog.id) {
    await saveProgram(prog);
  } else {
    await saveProgram(prog);
    // Auto-activate if first program
    if (programs.length === 1) await setActiveProgram(programs[0].id);
  }
  closeProgBuilder();
  renderPrograms();
  renderHome();
}

// ═══════════════════════════════════════════
// EXERCISE PICKER
// ═══════════════════════════════════════════
let exPickerMG = 'All';
let exPickerDayIdx = 0;

function openExPicker(dayIdx) {
  exPickerDayIdx = dayIdx;
  exPickerSelected = null;
  exPickerMG = 'All';
  el('exSearch').value = '';

  // Muscle group chips
  const mgs = ['All', ...MG_ALL];
  el('mgChips').innerHTML = mgs.map(mg =>
    `<div class="mg-chip ${mg===exPickerMG?'active':''}" onclick="selectMG('${mg}')">${mg}</div>`
  ).join('');

  renderExList();
  show('exPicker');
  setTimeout(()=>el('exSearch').focus(),300);
}

function selectMG(mg) {
  exPickerMG = mg;
  el('mgChips').querySelectorAll('.mg-chip').forEach(c => c.classList.toggle('active', c.textContent===mg));
  renderExList();
}

function filterExercises() { renderExList(); }

function renderExList() {
  const q = (el('exSearch').value||'').toLowerCase();
  let items = [];
  const mgs = exPickerMG === 'All' ? MG_ALL : [exPickerMG];
  mgs.forEach(mg => {
    EX[mg].forEach(name => {
      if (!q || name.toLowerCase().includes(q) || mg.toLowerCase().includes(q)) {
        items.push({ name, muscle: mg });
      }
    });
  });
  // Add custom exercises if they match
  if (q && !items.find(i=>i.name.toLowerCase()===q)) {
    items.unshift({ name: q.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '), muscle: exPickerMG==='All'?'Other':exPickerMG, custom:true });
  }
  el('exList').innerHTML = items.slice(0,40).map(ex => `
    <div class="ex-item" onclick="selectExercise('${ex.name.replace(/'/g,"\\'")}','${ex.muscle}')">
      <div>
        <div class="ex-item-name">${ex.custom?'+ Add "'+ex.name+'"':ex.name}</div>
        <div class="ex-item-mg">${ex.muscle}</div>
      </div>
      <div class="ex-item-add">+</div>
    </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--muted)">No exercises found</div>';
}

function selectExercise(name, muscle) {
  exPickerSelected = { name, muscle };
  setConfigSets = 3;
  setConfigReps = 8;
  el('setConfigExName').textContent = name;
  el('setConfigMuscle').textContent = muscle;
  el('setsVal').textContent = setConfigSets;
  el('repsVal').textContent = setConfigReps;
  hide('exPicker');
  show('setConfig');
}

function adjSets(d) { setConfigSets = Math.max(1,Math.min(10,setConfigSets+d)); el('setsVal').textContent=setConfigSets; }
function adjReps(d) { setConfigReps = Math.max(1,Math.min(30,setConfigReps+d)); el('repsVal').textContent=setConfigReps; }

function confirmAddExercise() {
  if (!exPickerSelected) return;
  builder.prog.days[exPickerDayIdx].exercises.push({
    name: exPickerSelected.name,
    muscle: exPickerSelected.muscle,
    sets: setConfigSets,
    reps: String(setConfigReps)
  });
  hide('setConfig');
  renderBuilderStep();
}

function closeExPicker(e) { if(e.target===el('exPicker')) closeExPickerDirect(); }
function closeExPickerDirect() { hide('exPicker'); }
function closeSetConfig(e) { if(!e||e.target===el('setConfig')) { hide('setConfig'); show('exPicker'); } }

// HISTORY PAGE
// ═══════════════════════════════════════════
function switchHTab(n) {
  hTab = n;
  el('htab0').classList.toggle('active',n===0);
  el('htab1').classList.toggle('active',n===1);
  renderHistory();
}

function renderHistory() {
  if (hTab === 0) renderHistSessions();
  else renderHistProgress();
}

function renderHistSessions() {
  if (!workouts.length) {
    el('histBody').innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No sessions yet</div><div class="empty-sub">Start your first workout and it will appear here.</div></div>`;
    return;
  }
  el('histBody').innerHTML = workouts.slice(0,30).map(w => {
    const exCount = (w.exercises||[]).length;
    const totalSets = (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0);
    return `
      <div class="hist-session" onclick="this.classList.toggle('expanded')">
        <div class="hist-session-hdr">
          <div>
            <div class="hist-session-date">${w.dayName||'Workout'}</div>
            <div class="hist-session-meta">${dateLabel(new Date(w.date))} · ${exCount} exercises · ${totalSets} sets${w.duration?' · '+w.duration+' min':''}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            ${(w.newPRs||[]).length?`<div style="font-size:16px">🏆</div>`:''}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="hist-session-body">
          ${(w.exercises||[]).map(e=>`
            <div class="hist-ex">
              <div class="hist-ex-name">${e.name}</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${(e.sets||[]).map(s=>`<div class="hist-set-chip">${s.weight}${settings.unit}×${s.reps}</div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderHistProgress() {
  // Collect all exercises that have been logged
  const allEx = new Set();
  workouts.forEach(w => (w.exercises||[]).forEach(e => allEx.add(e.name)));
  const exArr = [...allEx].sort();

  if (!exArr.length) {
    el('histBody').innerHTML = `<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No data yet</div><div class="empty-sub">Log some workouts to see your progress.</div></div>`;
    return;
  }

  const selEx = exArr[0];
  el('histBody').innerHTML = `
    <select class="ex-select" id="progExSelect" onchange="renderExChart(this.value)">
      ${exArr.map(e=>`<option value="${e}">${e}</option>`).join('')}
    </select>
    <div id="chartArea"></div>
    <div id="prSection"></div>`;

  renderExChart(selEx);
}

function renderExChart(exName) {
  // Get all logged sets for this exercise
  const entries = [];
  workouts.slice().reverse().forEach(w => {
    const ex = (w.exercises||[]).find(e=>e.name===exName);
    if (!ex) return;
    const best = (ex.sets||[]).reduce((b,s) =>
      calc1RM(parseFloat(s.weight)||0,parseInt(s.reps)||0) > calc1RM(parseFloat(b?.weight)||0,parseInt(b?.reps)||0) ? s : b, null);
    if (best) entries.push({ date: w.date, weight: parseFloat(best.weight)||0, reps: parseInt(best.reps)||0, est: calc1RM(parseFloat(best.weight)||0,parseInt(best.reps)||0) });
  });

  if (!entries.length) { el('chartArea').innerHTML = '<div style="color:var(--muted);padding:20px 0;text-align:center">No data for this exercise</div>'; return; }

  const maxEst = Math.max(...entries.map(e=>e.est));
  const bars = entries.slice(-12).map(e => {
    const h = maxEst ? Math.round((e.est/maxEst)*100) : 10;
    return `<div class="chart-bar" style="height:${h}%" title="${e.weight}${settings.unit}×${e.reps}">
      <div class="chart-bar-lbl">${e.date.slice(5)}</div>
    </div>`;
  }).join('');

  const pr = prs[exName.replace(/\//g,'_')];
  const latestEst = entries[entries.length-1]?.est.toFixed(1);

  el('chartArea').innerHTML = `
    <div class="chart-container">
      <div class="chart-title">${exName} · Estimated 1RM</div>
      <div class="chart-area"><div class="chart-bars">${bars}</div></div>
      <div style="margin-top:24px;display:flex;gap:10px">
        <div class="stat-box" style="flex:1"><div class="stat-val">${latestEst}</div><div class="stat-lbl">Last ~1RM (${settings.unit})</div></div>
        ${pr?`<div class="stat-box" style="flex:1"><div class="stat-val" style="color:var(--orange)">${pr.est1rm?.toFixed(1)||'—'}</div><div class="stat-lbl">Best ~1RM (${settings.unit})</div></div>`:''}
      </div>
    </div>`;

  // Recent logs
  const recentHtml = entries.slice(-5).reverse().map(e=>`
    <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;color:var(--muted)">${dateLabel(new Date(e.date))}</div>
      <div style="font-size:14px;font-weight:800">${e.weight}${settings.unit} × ${e.reps} <span style="color:var(--muted);font-weight:400;font-size:12px">~${e.est.toFixed(1)} 1RM</span></div>
    </div>`).join('');
  el('prSection').innerHTML = `<div class="card"><span class="sec">Recent Logs</span>${recentHtml}</div>`;
}

      <div class="stat-box"><div class="stat-val">${streak}</div><div class="stat-lbl">Streak 🔥</div></div>

    <div class="card">

      <div class="setting-row">
        <div><div class="setting-label">Weight Unit</div></div>
        <div style="display:flex;gap:6px">
          <button class="chip ${settings.unit==='kg'?'chip-g':''}" onclick="setUnit('kg')">kg</button>
          <button class="chip ${settings.unit==='lbs'?'chip-g':''}" onclick="setUnit('lbs')">lbs</button>
        </div>
      </div>
      <div class="setting-row">

        <select style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;font-weight:700" onchange="setRestTime(this.value)">
          <option value="60" ${settings.restTime===60?'selected':''}>60 sec</option>

        <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-size:14px;font-weight:700">${key.replace(/_/g,'/')}</div><div style="font-size:11px;color:var(--muted)">${pr.date}</div></div>
          <div style="text-align:right"><div style="font-size:15px;font-weight:900;color:var(--orange)">${pr.weight}${settings.unit}×${pr.reps}</div><div style="font-size:11px;color:var(--muted)">~${pr.est1rm?.toFixed(1)} 1RM</div></div>
        </div>`).join('')}
    </div>` : ''}

    <div class="card">
      <button class="btn btn-outline" style="color:var(--red);border-color:var(--red)" onclick="logout()">Sign Out</button>
    </div>
  `;
}

async function setUnit(u) {
  await saveSettings({ unit: u });
  renderProfile();
}

async function setRestTime(v) {
  await saveSettings({ restTime: parseInt(v) });
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function calc1RM(weight, reps) {
  if (!weight || !reps || reps >= 30) return weight || 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps/30) * 10) / 10;
}

function dateStr(d) {
  return d.toISOString().split('T')[0];
}

function dateLabel(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const td = new Date(d); td.setHours(0,0,0,0);
  const diff = Math.round((today-td)/86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return `${diff} days ago`;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function calcStreak() {
  const dates = new Set(workouts.map(w=>w.date));
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds = dateStr(d);
    if (dates.has(ds)) { streak++; d.setDate(d.getDate()-1); }
    else if (ds === dateStr(new Date())) { d.setDate(d.getDate()-1); } // skip today if not yet logged
    else break;
  }
  return streak;
}

function workoutsThisWeek() {
  const d = new Date();
  const startOfWeek = new Date(d);
  startOfWeek.setDate(d.getDate() - ((d.getDay()+6)%7));
  startOfWeek.setHours(0,0,0,0);
  return workouts.filter(w => new Date(w.date) >= startOfWeek).length;
}

function prsThisWeek() {
  const d = new Date();
  const startOfWeek = new Date(d);
  startOfWeek.setDate(d.getDate() - ((d.getDay()+6)%7));
  const startStr = dateStr(startOfWeek);
  return Object.values(prs).filter(p=>p.date>=startStr).length;
}

function getPrevPerformance(exName) {
  for (const w of workouts) {
    const ex = (w.exercises||[]).find(e=>e.name===exName);
    if (ex && (ex.sets||[]).length) return ex;
  }
  return null;
}

function showPRToast(msg) {
  const t = el('prToast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

function showConfirm(title, msg, okLabel, cb) {
  el('confirmTitle').textContent = title;
  el('confirmMsg').textContent = msg;
  el('confirmOkBtn').textContent = okLabel;
  confirmCb = cb;
  show('confirmDialog');
}

function closeConfirm(ok) {
  hide('confirmDialog');
  if (ok && confirmCb) confirmCb();
  confirmCb = null;
}

function el(id) { return document.getElementById(id); }
function show(id, display='flex') { el(id).style.display=display; }
function hide(id) { el(id).style.display='none'; }
